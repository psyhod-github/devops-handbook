[defaults]
inventory = inventory.ini
remote_user = ec2-user
interpreter_python = auto_silent
# host_key_checking остаётся включённым (по умолчанию True): Ansible не подключится к серверу,
# если его ключ ИЗМЕНИЛСЯ — это защита от подмены сервера (MITM).

[ssh_connection]
# accept-new: ключ НОВОГО сервера записывается в ~/.ssh/known_hosts автоматически,
# а изменившийся ключ известного сервера — по-прежнему ошибка.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
