# Глава 10 — Docker Compose: весь стек одной командой
#
# Запуск из папки project/:
#   docker compose up -d --build
#   открыть http://localhost:8080

name: devops-handbook   # имя проекта: префикс контейнеров, сети и volume

services:

  backend:
    build: ../app/backend
    environment:
      - REDIS_URL=redis://redis:6379
      - APP_VERSION=1.0.0
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../app/frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ../app/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data   # счётчик переживает docker compose down / up

volumes:
  redis_data:
