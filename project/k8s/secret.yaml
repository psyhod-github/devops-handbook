# Учебный Secret: REDIS_URL без пароля, поэтому файл в репозитории.
# Настоящие секреты в git НЕ кладут (base64 — не шифрование): Sealed Secrets, SOPS,
# External Secrets Operator + AWS Secrets Manager — глава 17.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: bootcamp
type: Opaque
stringData:
  REDIS_URL: "redis://redis:6379"
